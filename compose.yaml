services:
  app:
    build: .
    restart: unless-stopped
    environment:
      BALL_DROP_PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      BALL_DROP_DATA_DIR: /data
    volumes:
      - app_data:/data
    # No host port: only Caddy can reach the Python server on this network.
    expose:
      - "8000"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
      - public
    depends_on:
      - app
networks:
  backend:
    internal: true
  public:
volumes:
  app_data:
  caddy_data:
  caddy_config:
